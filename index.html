    :root {
      --bg: #f4f7fb;
      --text: #18202e;
      --muted: #5e6b84;
      --card: #ffffff;
      --border: #d7deea;
      --panel: #eef3fa;
      --pill-bg: #edf3fb;
      --pill-border: #cbd8eb;
      --link: #0c6fdc;
      --hover: #e7eef9;
      --active: #dbe8fb;
      --shadow: rgba(0, 0, 0, 0.08);
      --photo-bg: #dbe5f5;
    }

    body.dark {
      --bg: #0b0f19;
      --text: #e6e8ee;
      --muted: #a9b2c7;
      --card: #020b1c;
      --border: #22304a;
      --panel: #0f1728;
      --pill-bg: #0f1728;
      --pill-border: #2b3d63;
      --link: #8fdfff;
      --hover: #16203a;
      --active: #1c2a4a;
      --shadow: rgba(0, 0, 0, 0.35);
      --photo-bg: #2a3b5f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .wrap {
      max-width: 2000px;
      margin: 0 auto;
      padding: 32px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 6px 18px var(--shadow);
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .name {
      font-size: 28px;
      margin: 0;
    }

    .muted {
      color: var(--muted);
      margin: 6px 0 0;
    }

    .pill {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      margin: 6px 8px 0 0;
      font-size: 14px;
    }

    .section {
      margin-top: 18px;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    a {
      color: var(--link);
    }

    .page-layout {
      display: grid;
      grid-template-columns: 280px 1fr 260px;
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding-right: 18px;
      position: sticky;
      top: 24px;
    }

    .main {
      min-width: 0;
    }

    .right-sidebar {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 18px;
      margin: 8px 0 14px;
      color: var(--text);
      font-weight: 700;
    }

    .cert-item {
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      border-radius: 10px;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .cert-item:hover {
      background: var(--hover);
    }

    .cert-item.active {
      background: var(--active);
      color: var(--text);
      border: 1px solid var(--pill-border);
    }

    .cert-img {
      width: 100%;
      max-width: 220px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--pill-border);
      background: #6d0555;
      display: block;
    }

    .two-col-section {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .col {
      flex: 1;
      min-width: 0;
    }

    .client-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: var(--text);
      font-size: 15px;
    }

    .flag {
      font-size: 20px;
    }

    .client-cols {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .client-col {

      min-width: 0;
    }

    .client-col-title {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 8px 0;
    }

    .contact-card {

      background: var(--panel);
      padding: 12px 14px;
      border-radius: 12px;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .contact-card a {
      text-decoration: none;
      color: var(--link);
      font-weight: 600;
      word-break: break-word;
    }

    .whatsapp-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 8px 24px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp-float:hover {

      color: #fff;
    }

    .wa-icon {
      font-size: 20px;
      line-height: 1;
    }

    .wa-text {
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .wrap {
        padding: 14px;
      }

      .card {
        padding: 12px;
      }

      .page-layout {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-right: 0;
        padding-bottom: 12px;
        position: static;
        top: auto;
        order: 3;
      }

      .main {
        order: 1;
      }

      .right-sidebar {
        position: static;
        top: auto;
        order: 2;
      }

      .two-col-section {
        flex-direction: column;
        gap: 16px;
      }

      .client-cols {
        flex-direction: column;
        gap: 14px;
      }

      .cert-img {
        max-width: 100%;
        width: 100%;
      }

      .whatsapp-float {
        right: 14px;
        bottom: 14px;
        padding: 12px 16px;
      }

      .wa-text {
        font-size: 13px;
      }

  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
        document.addEventListener("DOMContentLoaded", () => {
          document.body.classList.add("dark");
        });
      }
    })();
  </script>

    function applyTheme(theme) {
      if (theme === "dark") {
        document.body.classList.add("dark");
        document.documentElement.classList.add("dark");
      } else {
        document.body.classList.remove("dark");
        document.documentElement.classList.remove("dark");
      }
      localStorage.setItem("theme", theme);
      updateThemeButton();
    }

    updateThemeButton();

    themeToggle.addEventListener("click", () => {
      const isDark = document.body.classList.contains("dark");
      applyTheme(isDark ? "light" : "dark");
